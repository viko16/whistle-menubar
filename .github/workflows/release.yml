name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  package:
    name: Package macOS app
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run self tests
        run: ./script/test.sh

      - name: Package app
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}" ./script/package_app.sh

      - name: Create zip
        run: |
          mkdir -p dist/release
          ditto -c -k --keepParent \
            dist/whistle-menubar.app \
            "dist/release/whistle-menubar-${{ github.ref_name }}-macos-${{ runner.arch }}.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: whistle-menubar-${{ github.ref_name }}-macos-${{ runner.arch }}
          path: dist/release/whistle-menubar-${{ github.ref_name }}-macos-${{ runner.arch }}.zip
          archive: false
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ZIP_PATH: dist/release/whistle-menubar-${{ github.ref_name }}-macos-${{ runner.arch }}.zip
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ZIP_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$ZIP_PATH" \
              --title "$TAG_NAME" \
              --generate-notes \
              --verify-tag
          fi
